name: Deploy Next.js to VPS

on:
  push:
    branches:
      - main-prime  # runs on pushes to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code (needed only for rsync if copying locally)
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. SSH into VPS and deploy
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Go to project folder
            cd /root/trybae-inxource/Dashboard-Env

            # Stop old PM2 app
            pm2 stop nextjs-app || true
            pm2 delete nextjs-app || true

            # Force pull latest code
            git reset --hard
            git clean -fd
            git pull origin main-prime

            # Install dependencies with Bun
            bun install

            # Build with Node.js and increased memory
            NODE_OPTIONS="--max-old-space-size=1024" npm run build

            # Start app with Bun + PM2
            pm2 start npm --name nextjs-app -- start 

            # Enable PM2 startup on server reboot
            pm2 save
            pm2 startup
