options:
  logging: CLOUD_LOGGING_ONLY

# --- 1. Define where to find the secrets ---
# IMPORTANT: Map the secret name in Secret Manager to a local environment variable name
available_secrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
      env: '_OPENAI_KEY'
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_KEY/versions/latest
      env: '_NEXT_PUBLIC_SUPABASE_KEY'

steps:
  # 1️⃣ Install & Build (Combined to keep pnpm in scope)
  - name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        pnpm install
        # Adding --webpack here to avoid the Turbopack error we saw earlier
        pnpm run build --webpack
    env:
      - NODE_ENV=production
    secretEnv: ['_OPENAI_KEY', '_NEXT_PUBLIC_SUPABASE_KEY']

  # 2️⃣ Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source . \
          --update-secrets=_OPENAI_KEY=_OPENAI_KEY:latest,_NEXT_PUBLIC_SUPABASE_KEY=_NEXT_PUBLIC_SUPABASE_KEY:latest