options:
  logging: CLOUD_LOGGING_ONLY

available_secrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
      env: 'OPENAI_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_KEY/versions/latest
      env: '_NEXT_PUBLIC_SUPABASE_KEY'

steps:
  # 1️⃣ Build the Image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg OPENAI_API_KEY=$$OPENAI_API_KEY \
          --build-arg _NEXT_PUBLIC_SUPABASE_KEY=$$_NEXT_PUBLIC_SUPABASE_KEY \
          -t gcr.io/$PROJECT_ID/nextjs-app .
    secretEnv: ['OPENAI_API_KEY', '_NEXT_PUBLIC_SUPABASE_KEY']

    # 2️⃣ PUSH the Image (This fixes your "Not Found" error)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nextjs-app']
  
  # 3️⃣ Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --image gcr.io/$PROJECT_ID/nextjs-app \
          --region europe-west4 \
          --platform managed \
          --allow-unauthenticated \
          --clear-base-image \
          --port 3000 \
          --update-secrets=OPENAI_API_KEY=OPENAI_KEY:latest,_NEXT_PUBLIC_SUPABASE_KEY=NEXT_PUBLIC_SUPABASE_KEY:latest