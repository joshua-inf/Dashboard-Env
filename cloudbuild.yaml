options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1️⃣ Install & Build (Single container to keep pnpm/env vars alive)
  - name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        # --no-frozen-lockfile fixes the ERR_PNPM_OUTDATED_LOCKFILE you saw
        pnpm install --no-frozen-lockfile
        # --webpack fixes the Next.js 16 build crash
        pnpm build
    env:
      - NODE_ENV=production

  # 2️⃣ Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source . \