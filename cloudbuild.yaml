options:
  logging: CLOUD_LOGGING_ONLY

available_secrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
      env: 'OPENAI_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_KEY/versions/latest
      env: '_NEXT_PUBLIC_SUPABASE_KEY'

steps:
  # 1. Install dependencies
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['install']

  # 2. Build your Next.js app
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['run', 'build']

  # 3️⃣ Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source .