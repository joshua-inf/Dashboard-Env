options:
  logging: CLOUD_LOGGING_ONLY

available_secrets:
  secretManager:
    # We only keep secrets here that are needed DURING the build process
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_KEY/versions/latest
      env: 'NEXT_PUBLIC_SUPABASE_KEY'

steps:
  # 1. Install dependencies
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['install']

  # 2. Build your Next.js app 
  # NEXT_PUBLIC vars must be available here to be baked into the JS
  - name: 'node:22'
    entrypoint: 'bash'
    args:
      - -c
      - |
        npm run build
    secretEnv: ['NEXT_PUBLIC_SUPABASE_KEY']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source . \
          --set-secrets="OPENAI_API_KEY=OPENAI_KEY:latest"