options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
    env: OPENAI_KEY

steps:
  # 1️⃣ Install dependencies
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['install']
    env:
      - 'NODE_ENV=production'

  # 2️⃣ Build Next.js (SECRETS NEEDED HERE)
  - name: 'node:22'
    entrypoint: 'npm'
    args: ['run', 'build']
    env:
      # Public / non-secret
      - 'NODE_ENV=production'
      - 'NEXT_PUBLIC_SUPABASE_URL=https://gaicgetnnwptxbqooywd.supabase.co'
      - 'SUPABASE_BUCKET=uploaded-files'
      - 'NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in'
      - 'NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up'

      # Secrets (from Secret Manager)
      - 'OPENAI_KEY=$$OPENAI_KEY'

  # 3️⃣ Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source .
    env:
      - 'OPENAI_KEY=$$OPENAI_KEY'
