options:
  logging: CLOUD_LOGGING_ONLY

# --- 1. Map Google Secret names to your App's Variable names ---
available_secrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
      env: 'OPENAI_API_KEY'  # Remapped for your code
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_KEY/versions/latest
      env: '_NEXT_PUBLIC_SUPABASE_KEY'  # Remapped for your code

steps:
  # 1️⃣ Build Step
  - name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        pnpm install --no-frozen-lockfile
        pnpm run build --webpack
    env:
      - NODE_ENV=production
    # Use the 'env' names defined in the available_secrets block above
    secretEnv: ['OPENAI_API_KEY', '_NEXT_PUBLIC_SUPABASE_KEY']

  # 2️⃣ Deployment Step
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --image gcr.io/$PROJECT_ID/nextjs-app \
          --clear-base-image \
          --update-secrets=OPENAI_API_KEY=OPENAI_KEY:latest,_NEXT_PUBLIC_SUPABASE_KEY=NEXT_PUBLIC_SUPABASE_KEY:latest