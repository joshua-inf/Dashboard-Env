options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SMTP_PASS/versions/latest
      env: SMTP_PASS
    - versionName: projects/$PROJECT_ID/secrets/SMTP_USER/versions/latest
      env: SMTP_USER
    - versionName: projects/$PROJECT_ID/secrets/SMTP_HOST/versions/latest
      env: SMTP_HOST
    - versionName: projects/$PROJECT_ID/secrets/SMTP_PORT/versions/latest
      env: SMTP_PORT
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
      env: OPENAI_KEY

steps:
  # 1️⃣ Install dependencies
  - name: node:24
    entrypoint: npm
    args: ['install']
    env:
      - NODE_ENV=production

  # 2️⃣ Build Next.js
  - name: node:24
    entrypoint: npm
    args: ['run', 'build']
    env:
      # Public / safe for frontend
      - NODE_ENV=production
      - SUPABASE_BUCKET=uploaded-files

      # Secrets injected from Secret Manager
      - SMTP_PASS=$$SMTP_PASS
      - SMTP_USER=$$SMTP_USER
      - SMTP_HOST=$$SMTP_HOST
      - SMTP_PORT=$$SMTP_PORT
      - OPENAI_KEY=$$OPENAI_KEY

  # 3️⃣ Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source .
