options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SMTP_PASS/versions/latest
      env: _SMTP_PASS
    - versionName: projects/$PROJECT_ID/secrets/SMTP_USER/versions/latest
      env: _SMTP_USER
    - versionName: projects/$PROJECT_ID/secrets/SMTP_HOST/versions/latest
      env: _SMTP_HOST
    - versionName: projects/$PROJECT_ID/secrets/SMTP_PORT/versions/latest
      env: _SMTP_PORT
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
      env: _OPENAI_KEY

steps:
  # 1️⃣ Install dependencies
  - name: node:24
    entrypoint: npm
    args: ['install']
    env:
      - _NODE_ENV=production

  # 2️⃣ Build Next.js
  - name: node:24
    entrypoint: npm
    args: ['run', 'build']
    env:
      - _NODE_ENV=production
      - _SUPABASE_BUCKET=uploaded-files
      - _NEXT_PUBLIC_SUPABASE_URL=https://gaicgetnnwptxbqooywd.supabase.co
      - _NEXT_PUBLIC_SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      - _NEXT_PUBLIC_PORT=8080
      - _NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
      - _NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
      - _NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Z2VudWluZS1yYWNlci0zNi5jbGVyay5hY2NvdW50cy5kZXYk

      # Secrets from Secret Manager
      - _SMTP_PASS=$_SMTP_PASS
      - _SMTP_USER=$_SMTP_USER
      - _SMTP_HOST=$_SMTP_HOST
      - _SMTP_PORT=$_SMTP_PORT
      - _OPENAI_KEY=$_OPENAI_KEY

  # 3️⃣ Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source .
