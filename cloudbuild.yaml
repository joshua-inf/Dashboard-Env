options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_PASSWORD/versions/latest
      env: SUPABASE_PASSWORD
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_PASSWORD_PB/versions/latest
      env: SUPABASE_PASSWORD_PB
    - versionName: projects/$PROJECT_ID/secrets/CLERK_SECRET_KEY/versions/latest
      env: CLERK_SECRET_KEY
    - versionName: projects/$PROJECT_ID/secrets/SMTP_PASS/versions/latest
      env: SMTP_PASS
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_KEY/versions/latest
      env: GEMINI_KEY
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
      env: OPENAI_KEY
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET/versions/latest
      env: SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET

steps:
  # 1️⃣ Install dependencies
  - name: node:24
    entrypoint: npm
    args: ['install']
    env:
      - NODE_ENV=production

  # 2️⃣ Build Next.js
  - name: node:24
    entrypoint: npm
    args: ['run', 'build']
    env:
      # Public / safe for frontend
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=https://gaicgetnnwptxbqooywd.supabase.co
      - NEXT_PUBLIC_SUPABASE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdhaWNnZXRubndwdHhicW9veXdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzE4MzI0MzksImV4cCI6MjA0NzQwODQzOX0.RZex9divfq6kxl8jwHeOvhvB_Qwqu4UiTuPz-4rOmEY
      - NEXT_PUBLIC_PORT=8080
      - SUPABASE_BUCKET=uploaded-files
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_Z2VudWluZS1yYWNlci0zNi5jbGVyay5hY2NvdW50cy5kZXYk
      - NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
      - NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up

      # Secrets injected from Secret Manager
      - SUPABASE_PASSWORD=$$SUPABASE_PASSWORD
      - SUPABASE_PASSWORD_PB=$$SUPABASE_PASSWORD_PB
      - CLERK_SECRET_KEY=$$CLERK_SECRET_KEY
      - SMTP_PASS=$$SMTP_PASS
      - GEMINI_KEY=$$GEMINI_KEY
      - OPENAI_KEY=$$OPENAI_KEY
      - SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET=$$SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET

  # 3️⃣ Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source .
