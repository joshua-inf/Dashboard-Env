options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_PASSWORD/versions/latest
      env: SUPABASE_PASSWORD
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_PASSWORD_PB/versions/latest
      env: SUPABASE_PASSWORD_PB
    - versionName: projects/$PROJECT_ID/secrets/CLERK_SECRET_KEY/versions/latest
      env: CLERK_SECRET_KEY
    - versionName: projects/$PROJECT_ID/secrets/SMTP_PASS/versions/latest
      env: SMTP_PASS
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_KEY/versions/latest
      env: GEMINI_KEY
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
      env: OPENAI_KEY
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET/versions/latest
      env: SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET

steps:
  # 1️⃣ Install dependencies
  - name: node:24
    entrypoint: npm
    args: ['install']
    env:
      - NODE_ENV=production

  # 2️⃣ Build Next.js
  - name: node:24
    entrypoint: npm
    args: ['run', 'build']
    env:
      # Public / safe for frontend
      - NODE_ENV=production
      - SUPABASE_BUCKET=uploaded-files

      # Secrets injected from Secret Manager
      - SMTP_PASS=$$SMTP_PASS
      - OPENAI_KEY=$$OPENAI_KEY

  # 3️⃣ Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source .
