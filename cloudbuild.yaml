options:
  logging: CLOUD_LOGGING_ONLY

available_secrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
      env: '_OPENAI_KEY'
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_KEY/versions/latest
      env: '_NEXT_PUBLIC_SUPABASE_KEY'

steps:
  # 1️⃣ Install dependencies (Using Corepack to ensure pnpm/npm works)
  - name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        npm install
    env:
      - NODE_ENV=production

  # 2️⃣ Build Next.js
  - name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        npm run build
    secretEnv: ['_OPENAI_KEY', '_NEXT_PUBLIC_SUPABASE_KEY']

  # 3️⃣ Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source . \
          --update-secrets=_OPENAI_KEY=_OPENAI_KEY:latest,_NEXT_PUBLIC_SUPABASE_KEY=_NEXT_PUBLIC_SUPABASE_KEY:latest