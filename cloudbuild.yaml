options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1️⃣ Install dependencies
  - name: node:24
    entrypoint: npm
    args: ['install']
    env:
      - _NODE_ENV=production

  # 2️⃣ Build Next.js
  - name: node:24
    entrypoint: npm
    args: ['run', 'build']
    

  # 3️⃣ Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source .
