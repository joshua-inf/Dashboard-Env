options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1️⃣ Build Step
  - name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        corepack enable
        pnpm install --no-frozen-lockfile
        pnpm build

  # 2️⃣ Deployment Step
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source . \