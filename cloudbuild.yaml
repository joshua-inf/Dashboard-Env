options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SMTP_PASS/versions/latest
      env: _SMTP_PASS
    - versionName: projects/$PROJECT_ID/secrets/SMTP_USER/versions/latest
      env: _SMTP_USER
    - versionName: projects/$PROJECT_ID/secrets/SMTP_HOST/versions/latest
      env: _SMTP_HOST
    - versionName: projects/$PROJECT_ID/secrets/SMTP_PORT/versions/latest
      env: _SMTP_PORT
    - versionName: projects/$PROJECT_ID/secrets/OPENAI_KEY/versions/latest
      env: _OPENAI_KEY

steps:
  # 1️⃣ Install dependencies
  - name: node:24
    entrypoint: npm
    args: ['install']
    env:
      - _NODE_ENV=production

  # 2️⃣ Build Next.js
  - name: node:24
    entrypoint: npm
    args: ['run', 'build']
    env:
      # Public / safe for frontend
      - _NODE_ENV=production
      
      # Secrets injected from Secret Manager (match the updated Cloud Run env names)
      - _SMTP_PASS=$_SMTP_PASS
      - _SMTP_USER=$_SMTP_USER
      - _SMTP_HOST=$_SMTP_HOST
      - _SMTP_PORT=$_SMTP_PORT
      - _OPENAI_KEY=$_OPENAI_KEY

  # 3️⃣ Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy nextjs-app \
          --platform managed \
          --region europe-west4 \
          --allow-unauthenticated \
          --source .
    env:
      # Optional: pass secrets to deploy step if needed
      - _SMTP_PASS=$_SMTP_PASS
      - _SMTP_USER=$_SMTP_USER
      - _SMTP_HOST=$_SMTP_HOST
      - _SMTP_PORT=$_SMTP_PORT
      - _OPENAI_KEY=$_OPENAI_KEY
